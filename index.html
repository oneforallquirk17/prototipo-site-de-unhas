<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="stiles.css">
  <title>Formulário de criação de conta</title>
</head>
<body>
  <h1>Bem-vinda!</h1>
  <h3>Para inciar a sua experiência, crie a sua conta</h3>
  
  <label for="email">Crie o seu email:</label>
  <input type="email" id="email" name="email" placeholder="E-mail" required>
  <label for="senha">Crie a sua senha:</label>
  <input type="password" id="senha" name="senha" placeholder="Senha" required>
  
  <button type="submit" onclick="criarConta()">Criar Conta </button>
  
  <script src="code.js"></script>
</body>
</html>
